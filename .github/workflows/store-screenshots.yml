name: Capture App Store screens
on:
  push:
    branches: [release/app-store-1.1.0]
    paths: [.github/workflows/store-screenshots.yml, scripts/ios-capture/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axmed-store-screenshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      AXMED_HBAND_SIMULATOR_STUB: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_CAPABILITY_SYNC: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare native dependencies
        run: |
          npm ci --include=dev
          node -e 'for(const [key,value] of Object.entries(require("./eas.json").build.production.env)) require("fs").appendFileSync(process.env.GITHUB_ENV, key+"="+value+"\n")'
          node -e 'const fs=require("fs");const file="ios/Podfile.properties.json";const config=JSON.parse(fs.readFileSync(file));config["ios.buildReactNativeFromSource"]="false";fs.writeFileSync(file,JSON.stringify(config));'
          echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"
          pod install --project-directory=ios > pod-install.log 2>&1 || { tail -n 80 pod-install.log; exit 1; }
      - name: Build simulator app
        run: |
          xcodebuild -workspace ios/AxMed.xcworkspace -scheme AxMed -configuration Release -sdk iphonesimulator -derivedDataPath .capture-build CODE_SIGNING_ALLOWED=NO build > native-build.log 2>&1 || { tail -n 100 native-build.log; exit 1; }
      - name: Prepare UI capture project
        env:
          AXMED_PREVIEW_CREDENTIALS: ${{ secrets.AXMED_PREVIEW_CREDENTIALS }}
        run: ruby scripts/ios-capture/create-project.rb
      - name: Capture iPhone and iPad
        run: |
          mkdir -p artifacts/screenshots
          xcrun simctl list devices available -j > .capture-devices.json
          node -e 'const all=Object.entries(require("./.capture-devices.json").devices).sort(([a],[b])=>b.localeCompare(a,undefined,{numeric:true})).flatMap(([,devices])=>devices);for(const [kind,pattern] of [["iphone-6.9",/iPhone (17|16) Pro Max/],["ipad-13",/iPad Pro 13-inch/]]){const device=all.find(item=>pattern.test(item.name));if(!device)throw Error("No compatible simulator: "+kind);console.log(kind+"\t"+device.udid)}' > .capture-targets.tsv
          while IFS=$'\t' read -r kind udid; do
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance light
            xcrun simctl status_bar "$udid" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" .capture-build/Build/Products/Release-iphonesimulator/AxMed.app
            xcodebuild -project scripts/ios-capture/AxMedCapture.xcodeproj -scheme AxMedCaptureTests -destination "platform=iOS Simulator,id=$udid" -configuration Debug -derivedDataPath .capture-ui CODE_SIGNING_ALLOWED=NO test > ui-capture.log 2>&1 || { tail -n 100 ui-capture.log; exit 1; }
            container=$(xcrun simctl get_app_container "$udid" com.axmed.capturetests.xctrunner data)
            mkdir -p "artifacts/screenshots/$kind"
            cp "$container/Documents/AxMedCaptures/"*.png "artifacts/screenshots/$kind/"
            xcrun simctl shutdown "$udid"
          done < .capture-targets.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: axmed-native-store-screenshots
          path: artifacts/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
