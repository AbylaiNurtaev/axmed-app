services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axmed}
      POSTGRES_USER: ${POSTGRES_USER:-axmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axmed_local_password}
    ports:
      - "5432:5432"
    volumes:
      - axmed_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  axmed_postgres_data:
